<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ace Stream Proxy</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121826; --panel2: #0e1420; --border: #1f2940;
    --text: #dbe4f3; --dim: #8391ab; --accent: #6ea8ff; --accent2: #8b5cf6;
    --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; padding: 14px 20px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand svg { width: 26px; height: 26px; }
  .brand b {
    font-size: 16px; letter-spacing: .2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    color: var(--dim); font-size: 12.5px; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--bad); box-shadow: 0 0 8px var(--bad); }

  nav { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); }
  nav button {
    appearance: none; border: 0; background: none; color: var(--dim); cursor: pointer;
    font: inherit; font-weight: 500; padding: 9px 16px; border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent;
  }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav .n { margin-left: 6px; font-size: 11px; background: var(--panel); border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px; }

  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  section[data-tab] { display: none; }
  section[data-tab].active { display: block; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  input[type=text], select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font: inherit; outline: none; min-width: 0;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  #search { flex: 1 1 200px; }
  #custom { flex: 2 1 280px; }
  button.primary {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
    color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 8px; padding: 8px 16px;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost {
    appearance: none; cursor: pointer; font: inherit; color: var(--dim);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
  }
  button.ghost:hover { color: var(--bad); border-color: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .logo {
    width: 40px; height: 40px; border-radius: 8px; background: var(--panel2);
    display: flex; align-items: center; justify-content: center; flex: none;
    color: var(--accent); font-weight: 700; font-size: 16px; overflow: hidden;
  }
  .card .logo img { width: 100%; height: 100%; object-fit: contain; }
  .card .meta { min-width: 0; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .grp { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stream { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .stream .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stream .content { font-weight: 600; margin-right: auto; word-break: break-all; }
  .kv { color: var(--dim); font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; }
  .kv b { color: var(--text); }
  .codec { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
  .watchers { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .watcher { display: flex; gap: 10px; flex-wrap: wrap; color: var(--dim); font-size: 12.5px; padding: 6px 10px; background: var(--panel2); border-radius: 8px; }
  .watcher b { color: var(--text); font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.hls { color: var(--accent); border-color: var(--accent); }
  .badge.ts { color: var(--warn); border-color: var(--warn); }
  .badge.browser { color: var(--accent2); border-color: var(--accent2); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  tr:last-child td { border-bottom: 0; }
  td .ua { color: var(--dim); font-size: 12px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .empty { color: var(--dim); text-align: center; padding: 48px 0; }

  #overlay {
    position: fixed; inset: 0; z-index: 50; background: #05070b;
    display: none; flex-direction: column;
  }
  #overlay.open { display: flex; }
  .p-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .p-top .title { font-weight: 700; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-status { color: var(--dim); font-size: 12.5px; }
  .p-status.err { color: var(--bad); }
  video { flex: 1; width: 100%; min-height: 0; background: #000; outline: none; }
  #p-audio { max-width: 220px; }
  #p-close {
    appearance: none; cursor: pointer; background: none; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); width: 34px; height: 34px; font-size: 16px; flex: none;
  }
  #p-close:hover { border-color: var(--bad); color: var(--bad); }
  video:fullscreen { object-fit: contain; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#6ea8ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
    <b>Ace Stream Proxy</b>
  </div>
  <span class="chip"><span class="dot" id="h-engine"></span>engine <b id="h-status">…</b></span>
  <span class="chip">v<b id="h-ver">—</b></span>
  <span class="chip">стримы <b id="h-streams">0</b></span>
  <span class="chip">зрители <b id="h-clients">0</b></span>
</header>

<nav>
  <button data-tab="channels" class="active">Каналы <span class="n" id="n-channels">0</span></button>
  <button data-tab="streams">Трансляции <span class="n" id="n-streams">0</span></button>
  <button data-tab="clients">Клиенты <span class="n" id="n-clients">0</span></button>
</nav>

<main>
  <section data-tab="channels" class="active">
    <div class="toolbar">
      <select id="group"><option value="">Все группы</option></select>
      <input type="text" id="search" placeholder="Поиск канала…">
    </div>
    <div class="toolbar">
      <input type="text" id="custom" placeholder="content-id, acestream://, magnet:, http(s)://…">
      <button class="primary" id="play-custom">Смотреть</button>
    </div>
    <div class="grid" id="channels"></div>
    <div class="empty" id="channels-empty" hidden></div>
  </section>

  <section data-tab="streams">
    <div id="streams"></div>
    <div class="empty" id="streams-empty" hidden>Нет активных трансляций</div>
  </section>

  <section data-tab="clients">
    <table>
      <thead><tr><th>IP</th><th>Тип</th><th>Смотрит</th><th>Что смотрит</th><th>Клиент</th></tr></thead>
      <tbody id="clients"></tbody>
    </table>
    <div class="empty" id="clients-empty" hidden>Нет подключённых клиентов</div>
  </section>
</main>

<div id="overlay">
  <div class="p-top">
    <span class="title" id="p-title"></span>
    <span class="p-status" id="p-status"></span>
    <select id="p-audio" hidden></select>
    <button id="p-close" title="Закрыть">✕</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
</div>

<script>
'use strict';
// ?api=http://host:8080 — если фронт открыт не с того же origin (CORS на бэке открыт)
const BASE = new URLSearchParams(location.search).get('api') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur = s => s < 60 ? `${s}с` : s < 3600 ? `${s/60|0}м ${s%60|0}с` : `${s/3600|0}ч ${s%3600/60|0}м`;

async function api(path, opts) {
  const r = await fetch(BASE + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.status === 204 ? null : r.json();
}
const fetchText = url => fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
const fetchBuf = url => fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });

// ---------- state ----------
let tab = 'channels', health = null, streams = [], clients = [], channels = [];

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('section[data-tab]').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
  if (tab === 'clients') pollClients();
});

// ---------- header / streams / clients ----------
async function pollHealth() {
  try {
    health = await api('/api/health');
    $('#h-engine').className = 'dot ' + (health.engine ? 'on' : 'off');
    $('#h-status').textContent = health.engine ? 'ok' : 'down';
    $('#h-ver').textContent = health.version;
    $('#h-streams').textContent = health.active_streams;
    $('#h-clients').textContent = health.clients;
    $('#n-streams').textContent = health.active_streams;
    $('#n-clients').textContent = health.clients;
  } catch { $('#h-engine').className = 'dot off'; $('#h-status').textContent = 'нет связи'; }
}
async function pollStreams() {
  try { streams = await api('/api/streams'); } catch { return; }
  renderStreams();
}
async function pollClients() {
  try { clients = await api('/api/clients'); } catch { return; }
  $('#clients-empty').hidden = clients.length > 0;
  $('#clients').innerHTML = clients.map(c => `<tr>
    <td><b>${esc(c.ip)}</b></td>
    <td><span class="badge ${esc(c.kind)}">${esc(c.kind)}</span></td>
    <td>${fmtDur(c.watching_secs)}</td>
    <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.content)}</td>
    <td><span class="ua" title="${esc(c.user_agent)}">${esc(c.user_agent)}</span></td>
  </tr>`).join('');
}
function renderStreams() {
  $('#streams-empty').hidden = streams.length > 0;
  $('#streams').innerHTML = streams.map(s => `<div class="stream">
    <div class="row">
      <span class="content">${esc(s.content)}</span>
      ${s.video ? `<span class="codec">${esc(s.video)}</span>` : ''}
      <span class="kv">uptime <b>${fmtDur(s.uptime_secs)}</b></span>
      <span class="kv">зрители <b>${s.clients.length}</b></span>
      <button class="ghost" data-kill="${esc(s.id)}">Завершить</button>
    </div>
    ${s.clients.length ? `<div class="watchers">${s.clients.map(c =>
      `<div class="watcher"><b>${esc(c.ip)}</b><span class="badge ${esc(c.kind)}">${esc(c.kind)}</span><span>${fmtDur(c.watching_secs)}</span><span style="margin-left:auto">${esc(c.user_agent)}</span></div>`
    ).join('')}</div>` : ''}
  </div>`).join('');
  document.querySelectorAll('[data-kill]').forEach(b => b.onclick = async () => {
    await api('/api/streams/' + b.dataset.kill, { method: 'DELETE' }).catch(() => {});
    pollStreams(); pollHealth();
  });
}

// ---------- channels ----------
async function pollChannels() {
  try { channels = await api('/api/channels'); } catch { return; }
  $('#n-channels').textContent = channels.length;
  const groups = [...new Set(channels.map(c => c.group).filter(Boolean))].sort();
  const sel = $('#group'), cur = sel.value;
  sel.innerHTML = '<option value="">Все группы</option>' + groups.map(g => `<option>${esc(g)}</option>`).join('');
  sel.value = cur;
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  renderChannels();
}
function renderChannels() {
  const g = $('#group').value, q = $('#search').value.trim().toLowerCase();
  const list = channels.filter(c => (!g || c.group === g) && (!q || c.name.toLowerCase().includes(q)));
  $('#channels-empty').hidden = list.length > 0 || channels.length > 0;
  $('#channels-empty').textContent = channels.length ? 'Ничего не найдено' : 'Плейлист пуст — задайте PLAYLIST_URL на сервере';
  $('#channels').innerHTML = list.map(c => `<div class="card" data-play="${esc(c.id)}" data-name="${esc(c.name)}">
    <span class="logo" data-logo="${esc(c.logo || '')}" data-letter="${esc((c.name[0] || '?').toUpperCase())}">${esc((c.name[0] || '?').toUpperCase())}</span>
    <span class="meta"><span class="name">${esc(c.name)}</span><span class="grp">${esc(c.group)}</span></span>
  </div>`).join('');
  document.querySelectorAll('.logo[data-logo]:not([data-logo=""])').forEach(el => {
    const img = new Image();
    img.onload = () => { el.textContent = ''; el.appendChild(img); };
    img.src = el.dataset.logo;
  });
  document.querySelectorAll('[data-play]').forEach(el => el.onclick = () => play(el.dataset.play, el.dataset.name));
}
$('#group').onchange = renderChannels;
$('#search').oninput = renderChannels;
$('#play-custom').onclick = async () => {
  const content = $('#custom').value.trim();
  if (!content) return;
  try {
    const s = await api('/api/streams', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
    play(s.id, content);
  } catch (e) { alert('Не удалось запустить: ' + e.message); }
};

// ---------- m3u8 parsing ----------
function attrs(s) {
  const m = {}; const re = /([A-Z0-9-]+)=("[^"]*"|[^,]*)/g; let x;
  while ((x = re.exec(s))) m[x[1]] = x[2].replace(/^"|"$/g, '');
  return m;
}
// master → {media:false, variants:[{uri}], audios:[{uri,name,def}]}; media playlist → {media:true}
function parseMaster(text, base) {
  if (!text.includes('#EXT-X-STREAM-INF')) return { media: true };
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const variants = [], audios = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('#EXT-X-MEDIA:')) {
      const a = attrs(l.slice(13));
      if (a.TYPE === 'AUDIO' && a.URI) audios.push({ uri: new URL(a.URI, base).href, name: a.NAME || a.LANGUAGE || 'дорожка', def: a.DEFAULT === 'YES' });
    } else if (l.startsWith('#EXT-X-STREAM-INF:')) {
      let j = i + 1; while (j < lines.length && lines[j].startsWith('#')) j++;
      if (j < lines.length) variants.push({ uri: new URL(lines[j], base).href });
    }
  }
  return { media: false, variants, audios };
}
function parseMedia(text, base) {
  let init = null; const segs = [];
  for (const l of text.split('\n').map(l => l.trim())) {
    if (l.startsWith('#EXT-X-MAP:')) { const u = attrs(l.slice(11)).URI; if (u) init = new URL(u, base).href; }
    else if (l && !l.startsWith('#')) segs.push(new URL(l, base).href);
  }
  return { init, segs };
}

// ---------- MSE live HLS player (fMP4 from backend transcode) ----------
// ponytail: свой MSE-плеер вместо hls.js (требование «без зависимостей»); работает потому,
// что транскод бэкенда отдаёт fMP4-сегменты — демуксер не нужен. TS-потоки движка (passthrough)
// без hls.js играются только нативно (Safari).
const video = $('#video');
const P = { id: null, mse: null, audioIdx: 0 };

function setStatus(msg, err) { const el = $('#p-status'); el.textContent = msg; el.className = 'p-status' + (err ? ' err' : ''); }

const appendOne = (sb, buf) => new Promise((res, rej) => {
  sb.addEventListener('updateend', () => res(), { once: true });
  sb.addEventListener('error', () => rej(new Error('append failed')), { once: true });
  sb.appendBuffer(buf);
});
function makeAppender(sb) { // сериализованная очередь на один SourceBuffer
  let q = Promise.resolve();
  return buf => q = q.then(async () => {
    try { await appendOne(sb, buf); }
    catch { try { sb.remove(0, video.currentTime - 5); await appendOne(sb, buf); } catch { /* сегмент потерян, едем дальше */ } }
  });
}
const bufEnd = () => { const b = video.buffered; return b.length ? b.end(b.length - 1) : 0; };
const liveJump = () => { const e = bufEnd(); if (e > 0) video.currentTime = Math.max(0, e - 1.5); };

function runPlaylist(uri, sb, seen, st, isAudio) {
  let initAppended = null, first = true;
  const append = makeAppender(sb);
  const tick = async () => {
    if (st !== P.mse) return; // плеер перезапущен
    let pl;
    try { pl = parseMedia(await fetchText(uri), uri); } catch { return; } // транзиентная ошибка — ждём следующий тик
    if (pl.init && initAppended !== pl.init) { await append(await fetchBuf(pl.init)); initAppended = pl.init; }
    let fresh = pl.segs.filter(u => !seen.has(u));
    if (first) { fresh = fresh.slice(-3); first = false; } // начинаем у live-края
    for (const u of fresh) {
      seen.add(u);
      const b = await fetchBuf(u).catch(() => null);
      if (b) append(b);
    }
    if (fresh.length && !st.started) {
      st.startedCount = (st.startedCount || 0) + 1;
      if (st.startedCount >= (st.hasAudio ? 2 : 1)) { // ждём и видео, и аудио
        st.started = true;
        video.play().then(liveJump).catch(() => {});
      }
    }
  };
  tick();
  st.timers.push(setInterval(tick, 2000));
}

function startMSE(id) {
  stopMSE();
  const masterUrl = `${BASE}/play/${encodeURIComponent(id)}/master.m3u8`;
  const st = P.mse = { timers: [], seenV: new Set(), seenA: new Set(), started: false, hasAudio: false };
  const ms = st.ms = new MediaSource();
  video.src = URL.createObjectURL(ms);
  ms.addEventListener('sourceopen', async () => {
    if (st !== P.mse) return;
    try {
      const m = parseMaster(await fetchText(masterUrl), masterUrl);
      st.sbV = ms.addSourceBuffer('video/mp4');
      if (m.media) { setStatus('транскод (без аудио)'); runPlaylist(masterUrl, st.sbV, st.seenV, st, false); return; }
      const audio = m.audios[Math.min(P.audioIdx, m.audios.length - 1)];
      st.hasAudio = !!audio;
      if (audio) { st.sbA = ms.addSourceBuffer('audio/mp4'); }
      setStatus('транскод → браузер' + (audio ? ` · аудио: ${audio.name}` : ''));
      runPlaylist(m.variants[0].uri, st.sbV, st.seenV, st, false);
      if (audio) runPlaylist(audio.uri, st.sbA, st.seenA, st, true);
      st.trimmer = setInterval(() => { // не даём буферу расти бесконечно
        const from = video.currentTime - 60;
        for (const sb of [st.sbV, st.sbA]) if (sb && sb.buffered.length && sb.buffered.start(0) < from) sb.remove(0, from);
      }, 20000);
    } catch (e) { setStatus('Ошибка запуска: ' + e.message, true); }
  }, { once: true });
}
function stopMSE() {
  const st = P.mse; if (!st) return;
  P.mse = null;
  st.timers.forEach(clearInterval); clearInterval(st.trimmer);
  if (st.ms && st.ms.readyState === 'open') try { st.ms.endOfStream(); } catch {}
}
video.addEventListener('waiting', () => { if (bufEnd() - video.currentTime > 3) liveJump(); });

async function play(id, title) {
  $('#overlay').classList.add('open');
  $('#p-title').textContent = title;
  $('#p-audio').hidden = true;
  setStatus('запуск сессии…');
  video.removeAttribute('src'); video.load();
  P.id = id;
  let info;
  try { info = await api(`/api/streams/${encodeURIComponent(id)}/audio`); }
  catch (e) { setStatus('Ошибка: ' + e.message, true); return; }

  const sel = $('#p-audio'); // дорожки из probe; в MSE-режиме имена совпадают с рендишенами по порядку
  sel.innerHTML = info.tracks.map((t, i) => `<option value="${i}">аудио ${i + 1}: ${esc(t.codec)}${t.lang ? ' · ' + esc(t.lang) : ''}</option>`).join('');
  sel.hidden = info.tracks.length < 2;
  P.audioIdx = Math.min(P.audioIdx, Math.max(0, info.tracks.length - 1));
  sel.value = P.audioIdx;

  if (info.passthrough) {
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      setStatus('прямой HLS движка (без транскода)');
      video.src = `${BASE}/play/${encodeURIComponent(id)}/master.m3u8`;
      video.play().catch(() => {});
    } else {
      setStatus('Кодеки браузерные → движок отдаёт TS-HLS, который без hls.js играет только Safari. Настройте транскод на бэке (?transcode=1) или смотрите с Safari.', true);
    }
  } else {
    startMSE(id);
  }
}
$('#p-audio').onchange = e => { P.audioIdx = +e.target.value; if (P.id) { setStatus('переключение дорожки…'); startMSE(P.id); } };
$('#p-close').onclick = () => { stopMSE(); $('#overlay').classList.remove('open'); video.removeAttribute('src'); video.load(); P.id = null; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay').classList.contains('open')) $('#p-close').click(); });

// ---------- self-test (?selftest=1): парсер m3u8 — самое хрупкое место ----------
if (location.search.includes('selftest')) {
  const A = (cond, name) => { if (!cond) throw new Error('FAIL: ' + name); console.log('ok:', name); };
  const m1 = parseMaster('#EXTM3U\n#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="aac",NAME="Русский",DEFAULT=YES,LANGUAGE="rus",URI="audio_0.m3u8"\n#EXT-X-STREAM-INF:BANDWIDTH=2000000,CODECS="avc1.64001f,mp4a.40.2"\n0.m3u8\n', 'http://x/play/abc/master.m3u8');
  A(!m1.media && m1.variants[0].uri === 'http://x/play/abc/0.m3u8', 'variant uri');
  A(m1.audios.length === 1 && m1.audios[0].uri === 'http://x/play/abc/audio_0.m3u8' && m1.audios[0].def && m1.audios[0].name === 'Русский', 'audio rendition');
  A(parseMaster('#EXTM3U\n#EXT-X-TARGETDURATION:4\n', 'http://x/').media, 'media playlist detect');
  const p1 = parseMedia('#EXTM3U\n#EXT-X-TARGETDURATION:4\n#EXT-X-MAP:URI="init.mp4"\n#EXTINF:4.0,\nseg0.m4s\n#EXTINF:4.0,\nseg1.m4s\n', 'http://x/play/abc/0.m3u8');
  A(p1.init === 'http://x/play/abc/init.mp4' && p1.segs.length === 2 && p1.segs[1] === 'http://x/play/abc/seg1.m4s', 'media segments + map');
  A(attrs('A="1 2",B=3,C=""').A === '1 2' && attrs('A="1 2",B=3,C=""').B === '3', 'attrs');
  A(fmtDur(59) === '59с' && fmtDur(3725) === '1ч 2м', 'fmtDur');
  const pre = document.createElement('pre');
  pre.style.cssText = 'padding:20px;color:#34d399';
  pre.textContent = 'selftest: OK';
  document.body.prepend(pre);
}

// ---------- go ----------
pollHealth(); pollStreams(); pollChannels(); pollClients();
setInterval(pollHealth, 5000);
setInterval(pollStreams, 5000);
setInterval(pollClients, 5000);
setInterval(pollChannels, 60000);
